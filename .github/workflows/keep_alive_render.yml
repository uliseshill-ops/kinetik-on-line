name: Keep Alive Render KINETIK

on:
  schedule:
    # Se ejecuta cada 10 minutos (UTC)
    - cron: '*/10 * * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: ⚡ Ejecutar pulso Keep-Alive hacia Render
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          python scripts/ping_render.py